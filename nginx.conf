# Ensure that both Content-Length and Transfer-Encoding are not used simultaneously
map $http_content_length $content_length {
    default "";
    ""      "no_content_length";
}

map $http_transfer_encoding $transfer_encoding {
    default "";
    ""      "no_transfer_encoding";
}

server {
    listen 80;
    server_name example.com;

    # Enforce HTTP/2 if possible
    if ($http_upgrade = "h2c") {
        return 101;
    }

    location / {
        # Check for the presence of both Content-Length and Transfer-Encoding
        if ($content_length!= "no_content_length" and $transfer_encoding!= "no_transfer_encoding") {
            return 400 "Bad Request: Both Content-Length and Transfer-Encoding are present.";
        }

        # Reject malformed Transfer-Encoding
        if ($http_transfer_encoding!~* "chunked") {
            return 400 "Bad Request: Malformed Transfer-Encoding header.";
        }

        proxy_pass http://backend;
    }
}
