name: Mirror Bounty

on:
  issues:
    types: [opened]

jobs:
  mirror-bounty:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install thirtyoneday

    - name: Mirror bounty
      run: |
        python./mirror_bounty.py ${{ github.event.issue.html_url }}
