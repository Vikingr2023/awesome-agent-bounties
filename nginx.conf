server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Enforce HTTP/2 (This should be configured at the server level)
    # Note: This requires SSL/TLS, so you need to configure HTTPS as well.
    listen 443 ssl http2;
    ssl_certificate /etc/nginx/ssl/example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;

    # Disable HTTP/1.0 (if required)
    if ($http_version = "HTTP/1.0") {
        return 400 "HTTP/1.0 is not supported";
    }

    # Add security headers
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";

    location / {
        # Check for simultaneous presence of Content-Length and Transfer-Encoding
        if ($http_content_length ~* "\d" && $http_transfer_encoding ~* "chunked") {
            return 400 "Content-Length and Transfer-Encoding cannot be used together";
        }

        # Verify that Transfer-Encoding is either absent or exactly 'chunked'
        if ($http_transfer_encoding!~ "^chunked$") {
            return 400 "Invalid Transfer-Encoding header";
        }

        # Proxy pass to the backend
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}